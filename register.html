<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account · Prime Boostly</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/auth.css"><script src="/auth.js" defer></script></head><body class="auth-page"><main class="auth-shell"><section class="authbox"><a class="brand" href="/"><span class="mark">PB</span><span><b>PRIME</b><strong>BOOSTLY</strong></span></a><h1>Create your account</h1><p class="auth-lead">Set up a Prime Boostly preview account and continue to the dashboard.</p><form class="auth-form" data-auth-register novalidate><p class="auth-error" data-auth-error role="alert"></p><p class="auth-success" data-auth-success role="status"></p><label class="auth-field">Username<input name="username" autocomplete="username" placeholder="Choose a username" required minlength="3"></label><label class="auth-field">Email<input name="email" type="email" autocomplete="email" inputmode="email" placeholder="Enter your email" required></label><label class="auth-field">Password<div class="auth-input-wrap"><input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8"><button class="auth-toggle" type="button" data-password-toggle="register-password" aria-pressed="false">Show</button></div></label><label class="auth-field">Confirm Password<div class="auth-input-wrap"><input id="register-confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Repeat your password" required><button class="auth-toggle" type="button" data-password-toggle="register-confirm" aria-pressed="false">Show</button></div></label><button class="auth-submit" type="submit">Create Account →</button></form><p class="auth-foot">Already registered? <a href="/login.html">Sign in</a></p><a class="auth-back" href="/">← Back to home</a><p class="auth-note">Preview authentication only. The password is stored as a one-way browser hash, not as plain text.</p></section></main></body></html>
