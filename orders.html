<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orders · Prime Boostly</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="pb-mobile-bg">
  <main class="mobile figma-orders" data-figma-node="6:663">
    <header class="mtop">
      <a class="brand figma-brand" href="/" aria-label="Prime Boostly home">
        <span class="mark">B</span>
        <span><b>PRIME</b><strong>BOOSTLY</strong></span>
      </a>
      <a class="menu" href="/dashboard.html" aria-label="Open menu">☰</a>
    </header>

    <section class="mobile-content orders-content">
      <h1>Orders</h1>
      <p class="lead">Track your latest service orders.</p>

      <div class="stats" aria-label="Order statistics">
        <div class="processing"><small>Processing</small><b>18</b></div>
        <div class="completed"><small>Completed</small><b>1,201</b></div>
        <div class="issues"><small>Issues</small><b>3</b></div>
      </div>

      <label class="mobile-search">
        <span>Search</span>
        <div>Order ID or service</div>
      </label>

      <nav class="chips order-chips" aria-label="Order status">
        <span class="active">All</span>
        <span>Pending</span>
        <span>Completed</span>
      </nav>

      <a class="order" href="/order-detail.html">
        <div class="order-top"><span>#1248</span><em class="badge completed-badge">Completed</em></div>
        <h3>Instagram Followers</h3>
        <div class="order-bottom"><b>₦1,850</b><span>View details →</span></div>
      </a>

      <a class="order" href="/order-detail.html">
        <div class="order-top"><span>#1247</span><em class="badge warn processing-badge">Processing</em></div>
        <h3>TikTok Views</h3>
        <div class="order-bottom"><b>₦720</b><span>View details →</span></div>
      </a>

      <a class="order" href="/order-detail.html">
        <div class="order-top"><span>#1246</span><em class="badge warn pending-badge">Pending</em></div>
        <h3>YouTube Views</h3>
        <div class="order-bottom"><b>₦1,200</b><span>View details →</span></div>
      </a>
    </section>
  </main>
</body>
</html>
