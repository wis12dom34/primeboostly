<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>Reset Password · Prime Boostly</title>
<link href="/style.css" rel="stylesheet"/>
<link href="/reset-password.css" rel="stylesheet"/>
<script defer="" src="/auth.js"></script>
<link href="/customer-polish.css" rel="stylesheet"/><script defer="" src="/customer-polish.js"></script></head>
<body class="reset-password-page pb-ui">
<header class="reset-user-header">
<a aria-label="Prime Boostly home" class="brand reset-brand" href="/"><span class="mark">B</span><span><b>PRIME</b><strong>BOOSTLY</strong></span></a>
<nav aria-label="Account navigation">
<a href="/dashboard.html">Dashboard</a>
<a href="/dashboard.html">Order</a>
<a href="/services.html">Services</a>
<a href="/add-funds.html">Add Fund</a>
<a href="/fund-history.html">Fund History</a>
<a href="/transactions.html">Transactions</a>
</nav>
<div class="reset-user"><span class="reset-avatar" data-auth-avatar="">WI</span><span data-auth-name="">wick</span></div>
<a aria-label="Open menu" class="reset-menu" href="/mobile-menu.html">☰</a>
</header>
<main class="reset-password-content pb-screen">
<h1 class="reset-mobile-title">Reset Password</h1>
<p class="reset-mobile-lead">Choose a new password for your Prime Boostly account.</p>
<section class="reset-password-card pb-component">
<h1>Reset Password</h1>
<p>Choose a new password for your Prime Boostly account.</p>
<form class="reset-password-form" data-auth-new-password="" novalidate="">
<p class="reset-form-message reset-error" data-auth-error="" role="alert"></p>
<p class="reset-form-message reset-success" data-auth-success="" role="status"></p>
<label>Email Address<input autocomplete="email" data-reset-email="" name="email" placeholder="user@example.com" required="" type="email"/></label>
<label>Password<input autocomplete="new-password" minlength="8" name="password" placeholder="New password" required="" type="password"/></label>
<label>Confirm Password<input autocomplete="new-password" name="confirm" placeholder="Confirm new password" required="" type="password"/></label>
<button type="submit">Reset Password</button>
</form>
</section>
</main>
</body>
</html>
