<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password · Prime Boostly</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/reset-password.css">
  <script src="/auth.js" defer></script>
</head>
<body class="reset-password-page">
  <header class="reset-user-header">
    <a class="brand reset-brand" href="/" aria-label="Prime Boostly home"><span class="mark">B</span><span><b>PRIME</b><strong>BOOSTLY</strong></span></a>
    <nav aria-label="Account navigation">
      <a href="/dashboard.html">Dashboard</a>
      <a href="/dashboard.html">Order</a>
      <a href="/services.html">Services</a>
      <a href="/add-funds.html">Add Fund</a>
      <a href="/fund-history.html">Fund History</a>
      <a href="/transactions.html">Transactions</a>
    </nav>
    <div class="reset-user"><span class="reset-avatar" data-auth-avatar></span><span data-auth-name>wick</span></div>
    <a class="reset-menu" href="/mobile-menu.html" aria-label="Open menu">☰</a>
  </header>

  <main class="reset-password-content">
    <h1 class="reset-mobile-title">Reset Password</h1>
    <p class="reset-mobile-lead">Choose a new password for your Prime Boostly account.</p>
    <section class="reset-password-card">
      <h1>Reset Password</h1>
      <p>Choose a new password for your Prime Boostly account.</p>
      <form class="reset-password-form" data-password-change novalidate>
        <p class="reset-form-message reset-error" data-auth-error role="alert"></p>
        <p class="reset-form-message reset-success" data-auth-success role="status"></p>
        <label>Email Address<input name="changeEmail" type="email" autocomplete="email" placeholder="user@example.com" required></label>
        <label>Password<input name="newPassword" type="password" autocomplete="new-password" placeholder="New password" required minlength="8"></label>
        <label>Confirm Password<input name="confirmNewPassword" type="password" autocomplete="new-password" placeholder="Confirm new password" required></label>
        <button type="submit">Reset Password</button>
      </form>
    </section>
  </main>
</body>
</html>
